# Alacritty Configuration

live_config_reload = true

[shell]
program = "/usr/bin/fish"

[env]
TERM = "xterm-256color"

[window]
padding = { x = 0, y = 0 }
dynamic_padding = true
decorations = "Full"

[scrolling]
history = 10000

[font]
size = 9.0

[font.normal]
family = "JuliaMono"
style = "Regular"

[font.bold]
family = "JuliaMono"
style = "Bold"

[font.italic]
family = "JuliaMono"
style = "Italic"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# Colors (Alabaster)
# author tonsky

[colors.primary]
background = '#F7F7F7'
foreground = '#434343'

[colors.cursor]
text = '#F7F7F7'
cursor = '#434343'

[colors.normal]
black = '#000000'
red = '#AA3731'
green = '#448C27'
yellow = '#CB9000'
blue = '#325CC0'
magenta = '#7A3E9D'
cyan = '#0083B2'
white = '#BBBBBB'

[colors.bright]
black = '#777777'
red = '#F05050'
green = '#60CB00'
yellow = '#FFBC5D'
blue = '#007ACC'
magenta = '#E64CE6'
cyan = '#00AACB'
white = '#FFFFFF'
